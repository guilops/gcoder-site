name: Publish Gcoder site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static site
        run: npm run build:pages
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          INSTAGRAM_URL: ${{ vars.INSTAGRAM_URL }}
          SERVICE_AREA: ${{ vars.SERVICE_AREA }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          BUSINESS_TAGLINE: ${{ vars.BUSINESS_TAGLINE }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
